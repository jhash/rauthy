name: Code Style

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event.pull_request.draft == false
    name: Check Code Style
    runs-on: rauthy-amd64
    steps:
      - uses: actions/checkout@v4
      - name: Install the rauthy-builder packages on the self-hosted runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential clang pkg-config libpam0g-dev libudev-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack
      - name: Setup && build UI
        run: |
          just build-wasm
          
          cd frontend
          npm install
          cd ..
          
          just build-ui
      - name: Code Format Backend
        run: cargo fmt --check
      - name: Code Style Backend
        run: cargo clippy -- -D warnings
      - name: Code Format UI
        working-directory: ./frontend
        run: npm run format-check
      - name: Code Style UI
        working-directory: ./frontend
        run: npm run check
      - name: Frontend Contract Tests
        working-directory: ./frontend
        run: npm run test:webauthn
        # The Chromium reset-page test (npm run test:password-reset) is not
        # wired here: it needs a browser binary plus the already-built
        # frontend. Run it locally after `just build-ui`.
